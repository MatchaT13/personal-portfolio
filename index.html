<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="dark.js" defer></script>
    <style>
        main{
            display: grid;
            grid-template-rows: 1fr 1fr 1fr;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            gap: 10px;
        }
        .head{
            grid-row: 2 / 3;
            grid-column: 2 / 4;
        }
       img{
        grid-row: 2 / 3;
        grid-column: 4 / 5;
        width: 200px;
        height: auto;
       }
    </style>
</head>
<body>
    <header></header>
    <main>
       <div class="head">
        <h1>Matcha T</h1>
        <p>Hello, welcome to my personal portfolio. My name is Matcha T. I am an aspiring artist and IT student who is currently working to build my portfolio.</p>
       </div>
       <img src="https://media.istockphoto.com/id/814013890/vector/matcha-green-tea-latte-cappuccino-drink-top-view.jpg?s=612x612&w=0&k=20&c=0nAGHAduZGIYQqGaDJmbZRfIKwz6BpyCFCo4sKOgJT0=" alt="matcha latte">
    </main>
    <footer></footer>
    <script src="include.js"></script>
</body>
</html>
